<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>선물 상품 상세 정보</title>
<style>
  :root{
    --bg:#eef2ff; --card:#ffffff; --ink:#0f172a; --muted:#64748b;
    --line:#e2e8f0; --blue:#2563eb;
    --red:#dc2626; --green:#16a34a; --amber:#b45309; --amberbg:#fffbeb;
  }
  *{box-sizing:border-box}
  body{margin:0;background:linear-gradient(180deg,#e0e7ff 0%,#f8fafc 320px);color:var(--ink);
    font-family:"Malgun Gothic","Apple SD Gothic Neo",system-ui,sans-serif;padding:22px 14px 60px;min-height:100vh}
  .wrap{max-width:640px;margin:0 auto}
  a.back{display:inline-block;font-size:13px;font-weight:800;color:var(--blue);text-decoration:none;margin-bottom:10px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:22px;
    box-shadow:0 6px 20px rgba(15,23,42,.06);margin-bottom:12px}
  h1{margin:0;font-size:24px;letter-spacing:-.5px}
  .sub{color:var(--muted);font-size:13px;margin:6px 0 0}
  table.spec{width:100%;font-size:13.5px;border-collapse:collapse;margin-top:14px}
  table.spec th,table.spec td{border:1px solid var(--line);padding:9px 10px;text-align:left}
  table.spec th{background:#f8fafc;width:130px;color:var(--muted);font-weight:700}
  .desc{font-size:14.5px;line-height:1.75;margin:14px 0 0}
  .hours{margin-top:12px;background:var(--amberbg);border:1px solid #fde68a;color:var(--amber);
    padding:10px 12px;border-radius:10px;font-size:13px;line-height:1.65}
  label.lbl{display:block;font-size:12.5px;font-weight:800;margin:0 0 6px;color:var(--muted)}
  select{width:100%;padding:10px 11px;font-size:14.5px;border:1.5px solid var(--line);
    border-radius:10px;background:#fff;color:var(--ink);margin-top:6px}
  .btnrow{display:flex;gap:8px;margin-top:12px}
  .btnrow a{flex:1;text-decoration:none}
  .btnrow button{width:100%;padding:13px;font-size:14px;font-weight:800;border-radius:12px;cursor:pointer}
  .btn-p{background:var(--ink);color:#fff;border:none}
  .btn-o{background:#fff;color:var(--blue);border:1.5px solid var(--line)}
  footer{font-size:12px;color:var(--muted);margin-top:16px;line-height:1.7;text-align:center}
</style>
</head>
<body>
<div class="wrap">
  <a class="back" href="index.html">← 계산기로 돌아가기</a>
  <div class="card">
    <h1 id="dTitle">—</h1>
    <p class="sub" id="dSub"></p>
    <table class="spec"><tbody id="dSpec"></tbody></table>
    <p class="desc" id="dDesc"></p>
    <div class="hours" id="dHours"></div>
  </div>
  <div class="card">
    <label class="lbl">다른 상품 보기</label>
    <select id="dSel"></select>
    <div class="btnrow">
      <a href="index.html"><button class="btn-p" type="button">계산기 열기</button></a>
      <a href="https://www.investing.com/economic-calendar" target="_blank" rel="noopener"><button class="btn-o" type="button">📅 경제 캘린더</button></a>
    </div>
  </div>
  <footer>거래시간은 대략 기준(서머타임·휴장 변동) — 실주문 전 증권사·거래소 확인.<br>교육용 정보이며 투자 조언이 아닙니다.</footer>
</div>

const $=id=>document.getElementById(id);
const fmt=(n,d=2)=>isFinite(n)?n.toLocaleString(undefined,{maximumFractionDigits:d}):"—";
const code=new URLSearchParams(location.search).get("code");
const sel=$("dSel");
Object.keys(INFO).forEach(c=>{
  const o=document.createElement("option");o.value=c;o.textContent=`${c} (${INFO[c].n})`;sel.appendChild(o);
});
function render(c){
  const s=INFO[c];
  if(!s){
    $("dTitle").textContent="상품을 선택하세요";
    $("dSub").textContent="";$("dSpec").innerHTML="";$("dDesc").textContent="";$("dHours").textContent="";
    return;
  }
  document.title=`${c} 상세 정보 — 선물 계산기`;
  $("dTitle").textContent=`${c} (${s.n})`;
  $("dSub").textContent=`${s.e} 상장`;
  $("dSpec").innerHTML=
    `<tr><th>거래소</th><td>${s.e}</td></tr>`+
    `<tr><th>1pt 가치</th><td>$${fmt(s.pv)}</td></tr>`+
    `<tr><th>틱 크기</th><td>${s.tick}</td></tr>`+
    `<tr><th>틱 가치</th><td>$${fmt(s.pv*s.tick)}</td></tr>`;
  $("dDesc").textContent=s.d;
  $("dHours").innerHTML=`🕒 거래시간(대략): <b>${s.h}</b>`;
  sel.value=c;
}
sel.onchange=()=>{location.href="detail.html?code="+encodeURIComponent(sel.value);};
render(INFO[code]?code:"ES");
</script>
</body>
</html>
